# Spec 017: tests, lint and an (unsigned) release build on every push and pull request
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Version tests (buildSrc)
        run: ./gradlew :buildSrc:test

      - name: Unit and Compose tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # R8 over the whole app: a missing keep rule fails here, not on a phone
      - name: Release build
        run: ./gradlew assembleRelease

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/
            buildSrc/build/reports/
          if-no-files-found: ignore
