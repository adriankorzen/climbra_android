# Spec 017: a signed APK and AAB, with R8's mapping, on a GitHub Release for every vX.Y.Z tag
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version comes from `git describe`
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CLIMBRA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::The secret CLIMBRA_RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "CLIMBRA_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew testDebugUnitTest

      - name: Signed release build
        env:
          CLIMBRA_RELEASE_STORE_PASSWORD: ${{ secrets.CLIMBRA_RELEASE_STORE_PASSWORD }}
          CLIMBRA_RELEASE_KEY_ALIAS: ${{ secrets.CLIMBRA_RELEASE_KEY_ALIAS }}
          CLIMBRA_RELEASE_KEY_PASSWORD: ${{ secrets.CLIMBRA_RELEASE_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.CLIMBRA_GOOGLE_SERVER_CLIENT_ID }}
          # Push notifications (spec 020); empty = a build without them
          FIREBASE_APP_ID: ${{ vars.CLIMBRA_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.CLIMBRA_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.CLIMBRA_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.CLIMBRA_FIREBASE_SENDER_ID }}
        run: >-
          ./gradlew assembleRelease bundleRelease
          "-Pclimbra.googleServerClientId=$GOOGLE_SERVER_CLIENT_ID"
          "-Pclimbra.firebase.appId=$FIREBASE_APP_ID"
          "-Pclimbra.firebase.apiKey=$FIREBASE_API_KEY"
          "-Pclimbra.firebase.projectId=$FIREBASE_PROJECT_ID"
          "-Pclimbra.firebase.senderId=$FIREBASE_SENDER_ID"

      - name: Verify the signature
        env:
          EXPECTED_SHA256: ${{ vars.CLIMBRA_RELEASE_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if [ -n "$EXPECTED_SHA256" ]; then
            echo "$CERTS" | grep -qi "SHA-256 digest: ${EXPECTED_SHA256//:/}" \
              || { echo "::error::The APK is not signed with the release certificate"; exit 1; }
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/climbra-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/climbra-$TAG.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/climbra-$TAG-mapping.txt"
          gh release create "$TAG" dist/* --title "Climbra $TAG" --generate-notes

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
